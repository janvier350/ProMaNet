<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Facturación Electrónica - Prueba</title>
    <link href="//maxcdn.bootstrapcdn.com/bootstrap/3.3.0/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
    <script src="//maxcdn.bootstrapcdn.com/bootstrap/3.3.0/js/bootstrap.min.js"></script>
    <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>
    <style type="text/css">
                    #loader {
                 bottom: 0;
                 height: 175px;
                 left: 0;
                 margin: auto;
                 position: absolute;
                 right: 0;
                 top: 0;
                 width: 175px;
                 display: none; /* Ocultar el loader inicialmente */
             }
             #loader .dot {
                 bottom: 0;
                 height: 100%;
                 left: 0;
                 margin: auto;
                 position: absolute;
                 right: 0;
                 top: 0;
                 width: 87.5px;
             }
             #loader .dot::before {
                 border-radius: 100%;
                 content: "";
                 height: 87.5px;
                 left: 0;
                 position: absolute;
                 right: 0;
                 top: 0;
                 transform: scale(0);
                 width: 87.5px;
             }
             #loader .dot:nth-child(7n+1) {
                 transform: rotate(45deg);
             }
             #loader .dot:nth-child(7n+1)::before {
                 animation: 0.8s linear 0.1s normal none infinite running load;
                 background: #00ff80 none repeat scroll 0 0;
             }
             #loader .dot:nth-child(7n+2) {
                 transform: rotate(90deg);
             }
             #loader .dot:nth-child(7n+2)::before {
                 animation: 0.8s linear 0.2s normal none infinite running load;
                 background: #00ffea none repeat scroll 0 0;
             }
             #loader .dot:nth-child(7n+3) {
                 transform: rotate(135deg);
             }
             #loader .dot:nth-child(7n+3)::before {
                 animation: 0.8s linear 0.3s normal none infinite running load;
                 background: #00aaff none repeat scroll 0 0;
             }
             #loader .dot:nth-child(7n+4) {
                 transform: rotate(180deg);
             }
             #loader .dot:nth-child(7n+4)::before {
                 animation: 0.8s linear 0.4s normal none infinite running load;
                 background: #0040ff none repeat scroll 0 0;
             }
             #loader .dot:nth-child(7n+5) {
                 transform: rotate(225deg);
             }
             #loader .dot:nth-child(7n+5)::before {
                 animation: 0.8s linear 0.5s normal none infinite running load;
                 background: #2a00ff none repeat scroll 0 0;
             }
             #loader .dot:nth-child(7n+6) {
                 transform: rotate(270deg);
             }
             #loader .dot:nth-child(7n+6)::before {
                 animation: 0.8s linear 0.6s normal none infinite running load;
                 background: #9500ff none repeat scroll 0 0;
             }
             #loader .dot:nth-child(7n+7) {
                 transform: rotate(315deg);
             }
             #loader .dot:nth-child(7n+7)::before {
                 animation: 0.8s linear 0.7s normal none infinite running load;
                 background: magenta none repeat scroll 0 0;
             }
             #loader .dot:nth-child(7n+8) {
                 transform: rotate(360deg);
             }
             #loader .dot:nth-child(7n+8)::before {
                 animation: 0.8s linear 0.8s normal none infinite running load;
                 background: #ff0095 none repeat scroll 0 0;
             }
             #loader .lading {
                 background-image: url("../images/loading.gif");
                 background-position: 50% 50%;
                 background-repeat: no-repeat;
                 bottom: -40px;
                 height: 20px;
                 left: 0;
                 position: absolute;
                 right: 0;
                 width: 180px;
             }
             @keyframes load {100% 
                 opacity: 0;
                 transform: scale(1);
             }
             
    </style>
</head>
<body>
<div class="container">
    <div class="row">
        <button id="showLoaderBtn" onclick="showLoader()">Mostrar Loader</button>
        <div id="loader">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="lading"></div>
        </div>
    </div>
</div> 

<script>
    function showLoader() {
        document.getElementById('loader').style.display = 'block'; // Mostrar el loader al hacer clic en el botón
        setTimeout(function() {
            document.getElementById('loader').style.display = 'none'; // Ocultar el loader después de 20 segundos
        }, 20000); // 20000 milisegundos = 20 segundos
    }
</script>
                
</body>
</html>
