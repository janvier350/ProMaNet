<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="ProMaNet">
  <defs>
    <linearGradient id="pmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5e72e4"/>
      <stop offset="1" stop-color="#825ee4"/>
    </linearGradient>
  </defs>
  <!-- Icon: rounded square con red de nodos -->
  <rect x="4" y="10" width="44" height="44" rx="10" fill="url(#pmGrad)"/>
  <g fill="#ffffff" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round">
    <line x1="15" y1="20" x2="26" y2="32" stroke-opacity="0.9"/>
    <line x1="37" y1="20" x2="26" y2="32" stroke-opacity="0.9"/>
    <line x1="15" y1="44" x2="26" y2="32" stroke-opacity="0.9"/>
    <line x1="37" y1="44" x2="26" y2="32" stroke-opacity="0.9"/>
    <circle cx="15" cy="20" r="3"/>
    <circle cx="37" cy="20" r="3"/>
    <circle cx="15" cy="44" r="3"/>
    <circle cx="37" cy="44" r="3"/>
    <circle cx="26" cy="32" r="4.2"/>
  </g>
  <!-- Wordmark -->
  <text x="60" y="40" font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="-0.4">
    <tspan fill="#344767">Pro</tspan><tspan fill="#5e72e4">Ma</tspan><tspan fill="#344767">Net</tspan>
  </text>
</svg>
